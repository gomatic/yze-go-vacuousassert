# Soft-finding baselines: a RATCHET — counts may only fall. Exceeding one
# fails the build and names the rule; a rule absent here is permitted zero.
# `soft:` is what makes a rule non-gating; `soft-baseline:` is only the
# per-rule ceiling APPLIED TO the rules named here.

soft-baseline:
  # Recorded from the 2026-08-02 full-suite sweep (stickler v0.10.0 /
  # yze v0.31.0): the counts at first contact with the current soft rule
  # set, on the ratchet — they may only fall. Probes (invariant, filesize,
  # enumdiscrim) await adjudication; rollout rules (errtest, errtested,
  # testfile, clidomain, cliflags, clilayout, fuzzreq, exhaustive) gate
  # again at zero.
  yze/enumdiscrim: 1
